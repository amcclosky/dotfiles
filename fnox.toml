# Encrypted to the SSH key, so copying ~/.ssh is enough to decrypt it.
# CODE_REPOS: the ~/code checkouts, one "<dir> <git url>" per line. Edit with
# `fnox get CODE_REPOS > list`, then `cat list | fnox set CODE_REPOS -p age`.
[providers.age]
type = "age"
key_file = "~/.ssh/id_ed25519"
recipients = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBh2ylJPqTG1mn3awAenfPDZ9jd9G1TTE0GwpXHOD+17"]

[secrets]
CODE_REPOS= { provider = "age", value = "" }
